<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body bgcolor="red" text="white">
    <h1> <a href="">Student Registration Form Using Table in HTML</a></h1>
    
    <form></form >
    

        <fieldset>

        
      <table cellspacing="20" hight="20"   width="20">
        <tr>
            <td>
                <label>First Name</label>

            </td>
            <td>
                <input type="tsxt"  placeholder="Nahida" />
                <label>(Max 50 Characters Allowed)</label>
            </td>
        </tr>
        <tr>
            <td>
                <label>Last Name</label>
            </td>
            <td>
                <input type="text"  placeholder="Parveen"/>
                <label>(Max 50 Characters Allowed)</label>
            </td>
        </tr>
        <tr>
            <td>
                <label>Email ID</label>
            </td>
            <td>
                <input type="text"  placeholder="nahida123@gmail.com"/>
            </td>
        </tr>
        <tr>
            <td>
                <label>Mobile Number</label>
            </td>
            <td>
                <input type="text" placeholder="2341xxxxxx" />
                <label>(10 Digits Allowed)</label>
            </td>
        </tr>
        <tr>
            <td>
                <label>Gender</label>
            </td>
            <td>
                <input type="radio" <label>Male</label>
                <input type="radio" <label>Female</label>
            </td>
        </tr>
        <tr>
            <td>
                <label>Date of Birth(DOB)</label>
            </td>
            <td>
                <select name="Day">
                    <option>Day</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                </select>
            
                <select name="Month">
                    <option>Month</option>
                    <option>Jan</option>
                    <option>Feb</option>
                    <option>Mar</option>
                    <option>Apr>/option>
                    <option>May</option>
                    <option>June</option>
                    </select>

                </select><select name="Year">
                    <option>Year</option>
                    <option>2004</option>
                    <option>2006</option>
                    <option>2012</option>
                    <option>2018</option>
                    <option>2022</option>
                    <option>2026</option>
                </select>
             

            </td>

        </tr>
        <td>
            <label>Address</label>
        </td>
        <td>
            <textarea type="text" cols="50" rows="10" placeholder="" ></textarea>
        </td>
        </tr>
        <tr>
            <td>
                <label>City</label>
            </td>
            <td>
                <input type="text" placeholder="Hajipur"/>
                <label>(Max 50 Characters Allowed)</label>

            </td>
        </tr>

        <tr>
            <td>
                <label>Pin Code</label>
            </td>
            <td>
                <input type="text" placeholder="844115"/>
                <label>(Max 50 Characters Allowed)</label>

            </td>
        </tr>
        <tr>
            <td>
                <label>State</label>
            </td>
            <td>
                <input type="text" placeholder="Bihar"/>
                <label>(Max 50 Characters Allowed)</label>

            </td>
        </tr>
        <tr>
            <td>
                <label>Country</label>
            </td>
            <td>
                <input type="text" placeholder="India"/>
                <label>(Max 50 Characters Allowed)</label>

            </td>
        </tr>
        <tr>
            <td>
                <label>Hubbies</label>
            </td>
            <td>
                <input type="checkbox" name="h1" value="Drawing" ><label>Drawing</label> 
               <input type="checkbox" name="h1" value="Singing" ><label>Singing</label>
                <input type="checkbox" name="h1" value="Dancing" ><label>Dancing</label> 
                <input type="checkbox" name="h1" value="Sketching" ><label>Sketching</label> 
                 
                <input type="checkbox" name="h1" value="Others"> <label>Others</label> 
                <input type="text" placeholder="Ex- Teaching">
                <label>(Max 50 Characters Allowed)</label>

            </td>
        </tr>
        <tr>
            <td>
                <label>Qualification</label>
            </td>
            <td>
            
                <input type="checkbox" value="High School(10th)" ><label>High School(10th)</label>
            <br>
            
                <input type="checkbox" value="Higher School(12th)" ><label>Higher School(12th)</label>
             <br>
              
                <input type="checkbox" value="Graduation(Bachelors)" ><label>Graduation(Bachelors)</label>
              <br>
                
                <input type="checkbox" value="Post Graduation(Masters)" ><label>Post Graduation(Masters)</label>
             <br>
             </td>
             
            </tr>
            
            <tr>
            <td>
                <label>Courses Applied For</label>
            </td>
            <td>
                <input type="radio" value="BCA(Bachelor of Computer Applications)" ><label>BCA(Bacgelor of Computer Applications)</label>
            <br>
            
                <input type="radio" value="B.Com(Bachelor of Commerce)" ><label>B.Com(Bachelor of Commerce)</label>
            <br>
            
                <input type="radio" value="B.Sc(Bachelor of Science)" ><label>B.Sc(Bachelor of Science)</label>
            <br>
            
            
                <input type="radio" value="BA(Bachelor of Arts)" ><label>BA(Bachelor of Arts)</label>
            <br>
            
                <input type="radio" value="MCA(Master of Computer Applications)" ><label>M.Com(Master of acaommerce)</label>
            <br>
            
                <input type="radio" value="M.Com(Master of acaommerce)" > <label>M.Com(Master of acaommerce)</label>
            <br>
            </td>



        </tr>
        <tr >
            <td colspan="9" align="center">
                <button  type="submit" name="b1">submit </button>
                <button  type="Reset" name="b1">Reset </button>

            </td>
        </tr>

      </table>
    </fieldset>
    
</body>
</html>
